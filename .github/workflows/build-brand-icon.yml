name: Build local brand icons
on:
  push:
    branches: ["feat/interactive-chart-tooltips"]
    paths:
      - "custom_components/renson_sense/brand/icon.svg"
      - ".github/workflows/build-brand-icon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Render transparent PNG icon assets
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          directory = Path("custom_components/renson_sense/brand")
          source = directory / "icon.svg"
          for resolution, name in ((256, "icon.png"), (512, "icon@2x.png")):
              cairosvg.svg2png(url=str(source), write_to=str(directory / name),
                               output_width=resolution, output_height=resolution)
              assert (directory / name).stat().st_size > 1000
          PY
      - name: Commit generated PNG assets to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/renson_sense/brand/icon.png "custom_components/renson_sense/brand/icon@2x.png"
          if ! git diff --cached --quiet; then
            git commit -m "chore(brand): render 256px and 512px integration icons"
            git push
          fi
