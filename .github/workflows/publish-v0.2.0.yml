name: Publish Renson Sense releases
on:
  workflow_run:
    workflows: ["Validate integration"]
    types: [completed]
    branches: [master]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Publish version from manifest if not already released
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          VERSION=$(python -c "import json; print(json.load(open('custom_components/renson_sense/manifest.json'))['version'])")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unrecognized release version: $VERSION" >&2
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
            exit 0
          fi
          if [[ -f "RELEASE_NOTES_$VERSION.md" ]]; then
            gh release create "v$VERSION" \
              --title "Renson Sense / Waves v$VERSION" \
              --notes-file "RELEASE_NOTES_$VERSION.md" \
              --target "$VALIDATED_SHA"
          else
            gh release create "v$VERSION" \
              --title "Renson Sense / Waves v$VERSION" \
              --generate-notes \
              --target "$VALIDATED_SHA"
          fi
