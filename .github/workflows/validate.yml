name: Validate integration
on:
  push:
    branches: [master]
  pull_request:

jobs:
  syntax-and-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate Python syntax
        run: python -m compileall -q custom_components tests
      - name: Test pure helper functions
        run: python -m unittest discover -s tests -v
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/renson_sense/manifest.json > /dev/null
          python -m json.tool custom_components/renson_sense/strings.json > /dev/null
      - name: Validate managed panel JavaScript syntax
        run: |
          node --check custom_components/renson_sense/www/renson-ventilation-panel.js
          node --check custom_components/renson_sense/www/renson-ventilation-loader.js
          node --check custom_components/renson_sense/www/renson-ventilation-date-range-picker.js
      - name: Test interactive Recorder tooltip
        run: node tests/test_chart_hover_tooltip.cjs custom_components/renson_sense/www/chart-hover-tooltip.js
      - name: Smoke test managed panel confirmations and history
        run: |
          node tests/test_managed_panel.cjs
          node tests/test_panel_loader.cjs
