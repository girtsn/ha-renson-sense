start_boost:
  name: Start ventilation boost
  description: >-
    Start a temporary Waves ventilation boost for the selected fan entity.
    Canceling a boost returns the fan to automatic ventilation, not zero airflow.
  target:
    entity:
      domain: fan
      integration: renson_sense
  fields:
    level:
      name: Boost level
      description: Percent of configured nominal airflow (100 is nominal).
      example: 100
      selector:
        number:
          min: 1
          max: 200
          step: 1
          unit_of_measurement: "%"
          mode: box
    duration:
      name: Duration
      description: Boost time in seconds (default taken from the device).
      example: 1800
      selector:
        number:
          min: 1
          max: 86400
          step: 1
          unit_of_measurement: s
          mode: box

calibrate:
  name: Calibrate ventilation
  description: >-
    Request a new Waves ventilation calibration. This measures duct pressure
    losses and may change airflow behaviour. Run only while physically present
    and after preparing the installation as instructed by Renson. The HTTP
    acknowledgement is not proof of successful calibration.
  target:
    entity:
      domain: fan
      integration: renson_sense
  fields:
    confirmation:
      name: Confirmation
      description: Type CALIBRATE exactly to allow this maintenance action.
      required: true
      example: CALIBRATE
      selector:
        text: {}

restart_device:
  name: Restart ventilator
  description: >-
    Restart the selected Waves ventilator. Temporarily interrupts extraction
    control and monitoring; the device may disconnect before acknowledging.
  target:
    entity:
      domain: fan
      integration: renson_sense
  fields:
    confirmation:
      name: Confirmation
      description: Type RESTART exactly to allow this maintenance action.
      required: true
      example: RESTART
      selector:
        text: {}
